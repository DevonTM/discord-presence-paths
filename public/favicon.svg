<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Magnifying glass circle -->
  <circle cx="27" cy="27" r="13" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.95"/>
  <!-- Magnifying glass handle -->
  <line x1="37" y1="37" x2="50" y2="50" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <!-- Small game controller hint inside lens -->
  <rect x="21" y="24" width="12" height="7" rx="3" fill="#5865f2" opacity="0.5"/>
</svg>
