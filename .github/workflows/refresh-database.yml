name: Refresh detectable database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-detectable-database
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SQLite database
        run: python generate_db.py --output /tmp/detectable.db

      - name: Commit updated database
        run: |
          python - <<'PY'
          import os
          import shutil
          import sqlite3
          import sys

          current_db = "public/detectable.db"
          new_db = "/tmp/detectable.db"

          def rows(path):
              conn = sqlite3.connect(path)
              try:
                  return list(conn.execute("SELECT name, path FROM games ORDER BY name COLLATE NOCASE, path"))
              finally:
                  conn.close()

          if os.path.exists(current_db) and rows(current_db) == rows(new_db):
              print("Database content did not change.")
              sys.exit(0)

          shutil.copyfile(new_db, current_db)
          print("Database content changed; copied new database into public/detectable.db.")
          PY

          if git diff --quiet -- public/detectable.db; then
            echo "Database file did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/detectable.db
          git commit -m "chore: refresh detectable database"
          git push
